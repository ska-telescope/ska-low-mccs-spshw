# Default values for mccs (ska-low-mccs-spshw )
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

display: ":0"
xauthority: "~/.Xauthority"

system: SW-infrastructure
subsystem: low-mccs-spshw
telescope: SKA-low

labels:
  app: ska-low-mccs-spshw

global:
  minikube: true
  tango_host: databaseds-tango-base:10000
  cluster_domain: cluster.local

mccs_anchor: &mccs_anchor
  image:
    registry: artefact.skao.int
    name: ska-low-mccs-spshw
    tag: 17.1.0
    pullPolicy: IfNotPresent

<<: *mccs_anchor
# Resources for simulators etc
resources:
  requests:
    cpu: 20m
    memory: 50Mi

simulators: {} # e.g.
  # subracks:
  #   s8-1-1:
  #     srmb_host: subrack-simulator-s8-1
  #     srmb_port: 8081
  #     bios_version: "1.8.0"  # optional; the simulator defaults to 1.6.0
  # pdus:
  #   ci-1:
  #     host: pdu-simulator-ci-1
  #     model: ENLOGIC
  #     port: 161  # optional; the Service defaults to the SNMP port

pgadmin4:
  enabled: false

ska-tango-devices:
  domain: low
  subsystem: mccs
  labels:
    app: ska-low-mccs-spshw

