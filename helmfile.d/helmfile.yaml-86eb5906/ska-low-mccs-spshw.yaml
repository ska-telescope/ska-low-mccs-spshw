global:
  cluster_domain: stfc-ral-k8s.skao.int
  minikube: false
  ska-tango-devices:
    waitForDatabaseDS: false
  tango_host: databaseds.skaffold.svc.stfc-ral-k8s.skao.int:10000
  telmodel:
    - datasets:
        - stfc-ral.yaml
        - stations/stfc-ral-4.yaml
      source: gitlab://gitlab.com/ska-telescope/mccs/ska-low-mccs-common?ac5a9b1e5fe2a990b0cabeaae999390b3ebebb85#tmdata/stfc-ral
ska-low-mccs-daq:
  bandpassLoadBalancer:
    enabled: false
  ska-tango-devices:
    deviceDefaults:
      MccsDaqReceiver:
        ConsumersToStart: DaqModes.INTEGRATED_CHANNEL_DATA
        Port: 50051
        SkuidUrl: http://ska-ser-skuid-ska-ser-skuid-svc:9870/
    deviceServers:
      daq:
        daq-stfc-ral-4:
          annotations:
            k8s.v1.cni.cncf.io/networks: kube-system/ral-sps@sdn1
          devices:
            MccsDaqReceiver:
              - low-mccs/daqreceiver/stfc-ral-4
          runtimeClassName: nvidia
          volumes:
            daq-data:
              claim: daq-data
              mountPath: /product
        daq-stfc-ral-4-bandpass:
          annotations:
            k8s.v1.cni.cncf.io/networks: kube-system/ral-sps@sdn1
          devices:
            MccsDaqReceiver:
              - low-mccs/daqreceiver/stfc-ral-4-bandpass
        daq-stfc-ral-4-calibration:
          annotations:
            k8s.v1.cni.cncf.io/networks: kube-system/ral-sps@sdn1
          devices:
            MccsDaqReceiver:
              - low-mccs/daqreceiver/stfc-ral-4-calibration
          runtimeClassName: nvidia
          volumes:
            daq-data:
              claim: daq-data
              mountPath: /product
    devices:
      MccsDaqReceiver:
        low-mccs/daqreceiver/stfc-ral-4:
          DaqId: 4
          Host: daqrx-stfc-ral-4
          NumberOfTiles: 8
          ParentTRL: low-mccs/spsstation/stfc-ral-4
          ReceiverInterface: sdn1
          StationID: 4
          StationName: stfc-ral-4
        low-mccs/daqreceiver/stfc-ral-4-bandpass:
          BandpassDaq: true
          DaqId: 4
          Host: daqrx-stfc-ral-4-bandpass
          NumberOfTiles: 8
          ParentTRL: low-mccs/spsstation/stfc-ral-4
          ReceiverInterface: sdn1
          StationID: 4
          StationName: stfc-ral-4
        low-mccs/daqreceiver/stfc-ral-4-calibration:
          DaqId: 4
          Host: daqrx-stfc-ral-4-calibration
          NumberOfTiles: 8
          ParentTRL: low-mccs/spsstation/stfc-ral-4
          ReceiverInterface: sdn1
          StationID: 4
          StationName: stfc-ral-4
  storage:
    daq-data:
      size: 250Mi
      storage_class: nfss1
